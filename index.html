<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MudaCol | Mudanzas en Colombia desde $500.000 COP</title>
    <meta
      name="description"
      content="Tu nuevo comienzo empieza con MudaCol. Mudanzas residenciales, de oficinas y pequeños negocios, locales e intermunicipales dentro de Colombia: Bogotá, Medellín, Cali, Cartagena y más. Desde $500.000 COP. Cotización gratuita y sin compromiso."
    />
    <meta name="theme-color" content="#0A0E17" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="MudaCol" />
    <meta property="og:title" content="MudaCol | Mudanzas en Colombia desde $500.000 COP" />
    <meta
      property="og:description"
      content="Tu nuevo comienzo empieza con MudaCol. Mudanzas locales e intermunicipales dentro de Colombia. Cotización gratuita y sin compromiso."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/images/og-mudacol.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fuentes servidas desde el propio sitio (src/main.tsx y src/index.css): Oswald, Inter y el
         subconjunto de Material Symbols (npm run icons). Se precarga la de íconos, que es pequeña. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/material-symbols.woff2" crossorigin />

    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/camion-furgon-1024.webp"
      imagesrcset="/images/camion-furgon-480.webp 480w, /images/camion-furgon-768.webp 768w, /images/camion-furgon-1024.webp 1024w, /images/camion-furgon-1376.webp 1376w"
      imagesizes="(min-width: 1280px) 500px, (min-width: 1024px) 40vw, 100vw"
      fetchpriority="high"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MovingCompany",
        "name": "MudaCol",
        "alternateName": "Mudanzas MudaCol",
        "slogan": "Tu nuevo comienzo empieza con MudaCol.",
        "description": "Mudanzas residenciales, de oficinas y pequeños negocios, locales e intermunicipales dentro de Colombia.",
        "telephone": "+57 304 311 3824",
        "email": "contacto@mudacol.com",
        "image": "%VITE_SITE_URL%/images/og-mudacol.jpg",
        "url": "%VITE_SITE_URL%/",
        "priceRange": "Desde $500.000 COP",
        "currenciesAccepted": "COP",
        "paymentAccepted": "Efectivo, transferencia bancaria",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Calle 156 # 7D-75",
          "addressLocality": "Bogotá",
          "addressRegion": "Bogotá D.C.",
          "addressCountry": "CO"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "08:00",
            "closes": "19:00"
          }
        ],
        "areaServed": { "@type": "Country", "name": "Colombia" },
        "sameAs": ["https://www.instagram.com/muda.col/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
