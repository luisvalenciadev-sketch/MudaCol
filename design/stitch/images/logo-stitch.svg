<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D47A1"/>
      <stop offset="100%" stop-color="#1E88E5"/>
    </linearGradient>
    <linearGradient id="silverBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C9D1DC"/>
      <stop offset="100%" stop-color="#8892B0"/>
    </linearGradient>
  </defs>
  <!-- Shield Emblem -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield Border -->
    <path d="M42 2 L76 14 C76 52 50 72 42 78 C34 72 8 52 8 14 Z" fill="#0A0E17" stroke="url(#silverBorder)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Inner Shield Gradient -->
    <path d="M42 6 L72 17 C72 48 48 66 42 72 C36 66 12 48 12 17 Z" fill="url(#shieldGrad)" opacity="0.95"/>
    <!-- Truck Silhouette inside Shield -->
    <g fill="#FFFFFF" transform="translate(20, 25) scale(0.75)">
      <!-- Truck cargo box -->
      <rect x="2" y="4" width="34" height="22" rx="2" fill="#FFFFFF"/>
      <!-- Cab -->
      <path d="M37 12 L47 12 L52 20 L52 26 L37 26 Z" fill="#FFFFFF"/>
      <!-- Cab window -->
      <path d="M40 14 L46 14 L49 19 L40 19 Z" fill="#0D47A1"/>
      <!-- Wheels -->
      <circle cx="12" cy="27" r="5" fill="#0A0E17" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="44" cy="27" r="5" fill="#0A0E17" stroke="#FFFFFF" stroke-width="2"/>
      <!-- Speed lines -->
      <rect x="-4" y="8" width="4" height="2" fill="#C9D1DC"/>
      <rect x="-6" y="14" width="5" height="2" fill="#C9D1DC"/>
    </g>
    <!-- MUDANZAS Banner in Shield -->
    <rect x="14" y="49" width="56" height="12" rx="2" fill="#0A0E17" stroke="#1E88E5" stroke-width="1"/>
    <text x="42" y="58" font-family="'Oswald', sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MUDANZAS</text>
  </g>
  <!-- Text Brand -->
  <g transform="translate(98, 22)">
    <text x="0" y="24" font-family="'Oswald', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="3.5">MUDANZAS</text>
    <text x="0" y="56" font-family="'Oswald', sans-serif" font-size="34" font-weight="800" fill="#1E88E5" letter-spacing="2">MUDACOL</text>
    <rect x="0" y="64" width="80" height="3" fill="#C9D1DC"/>
  </g>
</svg>