# Blueprint de Render: despliega la landing como sitio estático (CDN, sin servidor).
# En Render: New → Blueprint → elegir este repositorio.
services:
  - type: web
    name: mudacol
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Dominio público sin "/" final (Open Graph y JSON-LD). Completar cuando exista.
      - key: VITE_SITE_URL
        value: ""
      # Medición: pegar los ID cuando el cliente los entregue
      - key: VITE_GA_ID
        value: ""
      - key: VITE_META_PIXEL_ID
        value: ""
    headers:
      # Los archivos de assets llevan hash en el nombre: se pueden cachear por un año
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
